[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Import-Name bleibt `clutch`; PyPI-Distributionsname ist `clutch-router`,
# weil `clutch` auf PyPI bereits vergeben ist (altes GAE-Framework).
name = "clutch-router"
version = "0.6.3"
description = "Provider-neutral LLM orchestration engine and router (CLI/Web/API) with auto-learning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.10"
authors = [
    {name = "Lukas Geiger"},
]
keywords = [
    "ai",
    "agent-framework",
    "auto-routing",
    "budget-tracking",
    "circuit-breaker",
    "llm",
    "llm-agents",
    "llm-orchestration",
    "llm-router",
    "local-first",
    "model-routing",
    "multi-agent",
    "multi-provider",
    "open-source",
    "orchestration",
    "provider-neutral",
    "python",
    "python-library",
    "sqlite",
    "zero-egress",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/clutch"
Documentation = "https://github.com/ellmos-ai/clutch#readme"
Repository = "https://github.com/ellmos-ai/clutch"
Issues = "https://github.com/ellmos-ai/clutch/issues"
Changelog = "https://github.com/ellmos-ai/clutch/blob/master/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/clutch/blob/master/SECURITY.md"
Notice = "https://github.com/ellmos-ai/clutch/blob/master/NOTICE"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"Third-Party Licenses" = "https://github.com/ellmos-ai/clutch/blob/master/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/clutch/blob/master/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/clutch/blob/master/llms.txt"

[project.scripts]
clutch = "clutch.cli:main"

[tool.setuptools.packages.find]
include = ["clutch*"]

[tool.setuptools.package-data]
clutch = ["config/*.json", "locales/*.json", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -v --basetemp=.pytest_temp"
norecursedirs = [".pytest_temp", ".pytest_tmp*", ".hypothesis", ".turbo", ".nyc_output", ".tox"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file
]
