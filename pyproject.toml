[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clutch"
version = "0.4.0"
description = "Provider-neutral LLM orchestration engine with auto-learning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Lukas Geiger"},
]
keywords = ["llm", "orchestration", "ai", "multi-provider", "claude", "gemini", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/clutch"
Repository = "https://github.com/ellmos-ai/clutch"
Issues = "https://github.com/ellmos-ai/clutch/issues"

[project.scripts]
clutch = "clutch.cli:main"

[tool.setuptools.packages.find]
include = ["clutch*"]

[tool.setuptools.package-data]
clutch = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
