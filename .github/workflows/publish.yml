name: Publish to PyPI

# Veroeffentlicht clutch-router bei PyPI, sobald ein Tag `v*` gepusht wird.
# Nutzt PyPI Trusted Publishing (OIDC) -- KEIN API-Token noetig.
#
# Einmalige PyPI-Einrichtung (vor dem ersten echten Release):
#   PyPI -> Account -> Publishing -> Add a new pending publisher:
#     PyPI Project Name: clutch-router
#     Owner:             ellmos-ai
#     Repository name:   clutch
#     Workflow name:     publish.yml
#     Environment name:  pypi
# Danach genuegt `git push origin vX.Y.Z` zum Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # manueller Start moeglich (baut nur, publisht nur bei Tag)

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Nur bei einem echten Tag veroeffentlichen (nicht bei workflow_dispatch).
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/clutch-router
    permissions:
      id-token: write   # OIDC fuer Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
